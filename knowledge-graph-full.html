  references:'#94a3b8', routes:'#fbbf24', activates:'#a3e635',
  escalates:'#f87171', defers:'#94a3b8', defines:'#1e293b',

  callbacks:'#22d3ee', 'executed-by':'#22d3ee',
};

const LINK_DASH = { depends:'4,3', escalates:'2,2', defers:'4,3' };

const groupColor = g => C[g] || '#666';
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#graph').attr('viewBox', [0, 0, width, height]);
const defs = svg.append('defs');
defs.append('marker').attr('id','arrow').attr('viewBox','0 -3 6 6')
  .attr('refX',20).attr('refY',0).attr('markerWidth',4).attr('markerHeight',4)
  .attr('orient','auto').append('path').attr('d','M0,-3L6,0L0,3').attr('fill','#333');

const g = svg.append('g');
const zoomBehavior = d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoomBehavior);
svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(width*0.08, height*0.03).scale(0.82));

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(d => {
    if(d.type==='defines') return 50;
    if(d.type==='orchestrates'||d.type==='activates') return 110;
    if(d.type==='executed-by') return 70;
    return 85;
  }).strength(d => d.type==='defines'?0.5:d.type==='activates'?0.3:0.15))
  .force('charge', d3.forceManyBody().strength(d => -d.r * 22))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(d => d.r + 6))
  .force('x', d3.forceX(width/2).strength(0.025))
  .force('y', d3.forceY(height/2).strength(0.025));

const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('class','link')
  .attr('stroke', d => LINK_COLORS[d.type]||'#222')
  .attr('stroke-width', d => d.type==='orchestrates'||d.type==='invokes'?1.5:d.type==='defines'?0.4:0.8)
  .attr('stroke-dasharray', d => LINK_DASH[d.type]||null)
  .attr('marker-end', d => ['orchestrates','invokes','callbacks','routes','activates'].includes(d.type)?'url(#arrow)':null);

const nodeG = g.append('g').selectAll('g').data(nodes).join('g')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}));

nodeG.append('circle').attr('class','node-circle')
  .attr('r', d=>d.r)
  .attr('fill', d=>groupColor(d.group))
  .attr('fill-opacity', 0.12)
  .attr('stroke', d=>groupColor(d.group))
  .on('mouseover', (e,d) => {
    const tt = document.getElementById('tooltip');
    tt.querySelector('.tt-name').textContent = d.label;
    const cls = tt.querySelector('.tt-class');
    cls.textContent = d.group;
    cls.style.color = groupColor(d.group);
    cls.style.background = groupColor(d.group)+'18';
    tt.querySelector('.tt-desc').textContent = d.desc;
    const conns = links.filter(l=>(l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id);
    const out = conns.filter(l=>(l.source.id||l.source)===d.id).map(l=>`→ ${l.type} → ${l.target.label||l.target}`);
    const inc = conns.filter(l=>(l.target.id||l.target)===d.id).map(l=>`← ${l.type} ← ${l.source.label||l.source}`);
    tt.querySelector('.tt-meta').textContent = [...out,...inc].join('\n');
    tt.style.opacity = 1;
    tt.style.left = Math.min(e.clientX+16, width-440)+'px';
    tt.style.top = Math.min(e.clientY-10, height-250)+'px';
    d3.select(e.target).transition().duration(100).attr('r',d.r*1.3).attr('fill-opacity',0.3);
    link.attr('stroke-opacity', l=>(l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id?0.85:0.04);
    nodeG.selectAll('.node-label').attr('fill', n => {
      const connected = conns.some(l=>(l.source.id||l.source)===n.id||(l.target.id||l.target)===n.id);
      return connected||n.id===d.id?'#ddd':'#333';
    });
  })
  .on('mousemove', e => {
    const tt = document.getElementById('tooltip');
    tt.style.left = Math.min(e.clientX+16, width-440)+'px';
    tt.style.top = Math.min(e.clientY-10, height-250)+'px';
  })
  .on('mouseout', (e,d) => {
    document.getElementById('tooltip').style.opacity = 0;
    d3.select(e.target).transition().duration(100).attr('r',d.r).attr('fill-opacity',0.12);
    link.attr('stroke-opacity', 0.2);
    nodeG.selectAll('.node-label').attr('fill', '#555568');
  });

nodeG.append('text').attr('class','node-label').attr('dy', d=>d.r+11).text(d=>d.label);

simulation.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  nodeG.attr('transform', d=>`translate(${d.x},${d.y})`);
});

const groups = [...new Set(nodes.map(n=>n.group))];
const filtersDiv = document.getElementById('filters');
const activeGroups = new Set(groups);
groups.forEach(gr => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.textContent = gr;
  btn.style.color = C[gr];
  btn.onclick = () => {
    if(activeGroups.has(gr)){activeGroups.delete(gr);btn.classList.remove('active');}
    else{activeGroups.add(gr);btn.classList.add('active');}
    nodeG.attr('opacity', d=>activeGroups.has(d.group)?1:0.06);
    link.attr('opacity', d=>activeGroups.has(d.source.group)&&activeGroups.has(d.target.group)?1:0.03);
  };
  filtersDiv.appendChild(btn);
});

document.getElementById('stats').textContent = `${nodes.length} nodes · ${links.length} edges · ${groups.length} layers`;
</script>
</body>
</html>
